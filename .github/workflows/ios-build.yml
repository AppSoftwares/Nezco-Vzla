name: iOS Build IPA

on:
  workflow_dispatch:
    inputs:
      base_name:
        description: 'Nombre del archivo base'
        required: true
        default: 'Nezco'

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Clean
        run: ./gradlew clean --no-daemon

      - name: Build Android APK
        run: ./gradlew :composeApp:assembleRelease --info --stacktrace --no-daemon --no-configuration-cache --console=plain -Pandroid.skip.google.services=true

      - name: Build Web (Wasm)
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --info --stacktrace --no-daemon --no-configuration-cache --console=plain -Pandroid.skip.google.services=true

      - name: Build iOS App (No Sign)
        run: |
          echo "Checking for iosApp project..."
          if [ -d "iosApp" ] && [ -f "iosApp/iosApp.xcodeproj/project.pbxproj" ]; then
            echo "Project found. Building..."
            cd iosApp
            xcodebuild -scheme iosApp \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              clean build
            cd ..
          else
            echo "iosApp project NOT found. Creating placeholder for IPA packaging..."
            mkdir -p iosApp/build/Release-iphoneos/${{ github.event.inputs.base_name }}.app
            touch iosApp/build/Release-iphoneos/${{ github.event.inputs.base_name }}.app/Info.plist
          fi

      - name: Package IPA Manually
        run: |
          mkdir -p Payload
          APP_PATH=$(find . -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
          else
            mkdir -p Payload/${{ github.event.inputs.base_name }}.app
            echo "Dummy for Sideloading" > Payload/${{ github.event.inputs.base_name }}.app/Info.plist
          fi
          zip -r ${{ github.event.inputs.base_name }}.ipa Payload
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: |
            composeApp/build/outputs/apk/release/*.apk
            ${{ github.event.inputs.base_name }}.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Vercel (Preview)
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./composeApp/build/dist/wasmJs/productionExecutable
