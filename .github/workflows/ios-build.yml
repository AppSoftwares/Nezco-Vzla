name: iOS Build IPA

on:
  workflow_dispatch:
    inputs:
      base_name:
        description: 'Nombre del archivo base'
        required: true
        default: 'Nezco'

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          if [ ! -f composeApp/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore composeApp/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Clean
        run: ./gradlew clean --no-daemon

      - name: Verify Gradle config
        run: ./gradlew :composeApp:dependencies --configuration releaseRuntimeClasspath --no-daemon --console=plain || true

      - name: Build Android APK
        run: ./gradlew :composeApp:assembleRelease --stacktrace --no-daemon --no-configuration-cache --console=plain -Pandroid.skip.google.services=true
        env:
          JAVA_OPTS: "-Xmx6g"

      - name: Clean generated resources before Wasm build
        run: rm -rf composeApp/build/generated/compose

      - name: Build Web (Wasm)
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace --no-daemon --no-configuration-cache --console=plain -Pandroid.skip.google.services=true
        env:
          JAVA_OPTS: "-Xmx6g"

      - name: Build iOS App (No Sign)
        run: |
          echo "Checking for iosApp project..."
          if [ -d "iosApp" ] && [ -f "iosApp/iosApp.xcodeproj/project.pbxproj" ]; then
            echo "Project found. Building..."
            cd iosApp
            xcodebuild -scheme iosApp \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              clean build
            cd ..
          else
            echo "❌ ERROR: No se encontró el proyecto iosApp.xcodeproj."
            echo "Asegúrate de subir la carpeta iosApp completa a GitHub."
            exit 1
          fi

      - name: Package IPA Manually
        run: |
          mkdir -p Payload
          APP_PATH=$(find iosApp/build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: No se encontró el binario .app compilado."
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r ${{ github.event.inputs.base_name }}-V1.0.1.ipa Payload
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: |
            composeApp/build/outputs/apk/release/*.apk
            ${{ github.event.inputs.base_name }}-V1.0.1.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./composeApp/build/dist/wasmJs/productionExecutable
          vercel-args: '--prod'

