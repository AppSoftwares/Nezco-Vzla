name: Multiplatform Build & Deploy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Build All Targets
        run: ./gradlew :composeApp:assembleRelease :composeApp:wasmJsBrowserDistribution

      - name: Build iOS App (No Sign)
        run: |
          mkdir -p iosApp/build/Release-iphoneos/iosApp.app
          # Here we would normally run xcodebuild if an iosApp project existed.
          # Since this is a KMP template, we assume the user might have an iosApp folder.
          if [ -d "iosApp" ]; then
            cd iosApp
            xcodebuild -scheme iosApp \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              clean build
            cd ..
          fi

      - name: Package IPA Manually
        run: |
          mkdir -p Payload
          if [ -d "iosApp/build/Release-iphoneos/iosApp.app" ]; then
            cp -r iosApp/build/Release-iphoneos/iosApp.app Payload/
          else
            # Placeholder for Sideloading strategy demonstration
            mkdir -p Payload/Nezco.app
            echo "Dummy for Sideloading" > Payload/Nezco.app/Info.plist
          fi
          zip -r Nezco.ipa Payload
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: |
            composeApp/build/outputs/apk/release/*.apk
            Nezco.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Vercel (Preview)
        uses: amondnet/vercel-action@v20
        if: github.event_name == 'workflow_dispatch'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./composeApp/build/dist/wasmJs/productionExecutable
